services:

  # MySQL 데이터베이스
  lois-db:
    image: mysql:8.0
    restart: unless-stopped

    ports:
      - "127.0.0.1:3306:3306"

    environment:
      MYSQL_DATABASE: lois_db
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      - lois-db-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10


  # LOIS Spring Boot
  lois-app:
    image: ghcr.io/zzinobak/lois-management:latest
    restart: unless-stopped

    depends_on:
      lois-db:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: prod

      DB_URL: jdbc:mysql://lois-db:3306/lois_db?serverTimezone=Asia/Seoul
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_IPS: ${ALLOWED_IPS}

      SOLAPI_API_KEY: ${SOLAPI_API_KEY}
      SOLAPI_API_SECRET: ${SOLAPI_API_SECRET}
      SOLAPI_SENDER_NUMBER: ${SOLAPI_SENDER_NUMBER}
      SOLAPI_RECIPIENT_NUMBER: ${SOLAPI_RECIPIENT_NUMBER}

    volumes:
      - ./lois-logs:/app/logs


  # Reverse Proxy
  nginx:
    image: nginx:alpine
    restart: unless-stopped

    depends_on:
      - lois-app

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro


volumes:
  lois-db-data: