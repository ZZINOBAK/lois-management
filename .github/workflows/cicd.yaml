name: lois-docker-cicd


permissions:
  contents: read
  packages: write   # 🔥 GHCR에 이미지 push 하려면 꼭 필요

on:
  push:
    branches: [ "main" ]  # main에 푸시될 때마다 실행

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}        # GitHub 제공
          password: ${{ secrets.GITHUB_TOKEN }} # GitHub 제공

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 🔥 여기 수정: 전부 소문자로 된 owner/이미지이름 직접 지정
          tags: ghcr.io/zzinobak/lois-management:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy deployment files to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yaml,nginx/default.conf"
          target: "/home/ubuntu/lois-management"

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/lois-management

            mkdir -p lois-logs

            docker compose -f docker-compose.yaml pull
            docker compose -f docker-compose.yaml up -d

            sleep 10

            for i in {1..10}; do
              status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/actuator/health || echo "000")

              echo "Health check attempt $i: HTTP $status"

              if [ "$status" -eq 200 ]; then
                echo "Health check passed."
                exit 0
              fi

              sleep 5
            done

            echo "Health check failed after 10 attempts."
            docker compose -f docker-compose.yaml logs lois-app
            exit 1