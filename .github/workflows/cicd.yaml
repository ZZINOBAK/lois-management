name: lois-docker-cicd


permissions:
  contents: read
  packages: write   # 🔥 GHCR에 이미지 push 하려면 꼭 필요

on:
  push:
    branches: [ "main" ]  # main에 푸시될 때마다 실행

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}        # GitHub 제공
          password: ${{ secrets.GITHUB_TOKEN }} # GitHub 제공

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 🔥 여기 수정: 전부 소문자로 된 owner/이미지이름 직접 지정
          tags: ghcr.io/zzinobak/lois-management:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # EC2에 로그 저장할 디렉토리 생성
            mkdir -p /home/ec2-user/lois-logs

            # 이미지 pull 및 컨테이너 재기동
            docker pull ghcr.io/zzinobak/lois-management:latest || true
            docker stop lois || true
            docker rm lois || true
            
            docker run -d --name lois -p 127.0.0.1:8080:8080 \
            -e TZ=Asia/Seoul \
            -v /etc/localtime:/etc/localtime:ro \
            -v /home/ec2-user/lois-logs:/app/logs \
            --env-file /home/ec2-user/lois.env \
            ghcr.io/zzinobak/lois-management:latest
            
            # 🔍 헬스 체크 (최대 10번, 5초 간격 재시도)
            sleep 5
            for i in {1..10}; do
              status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || echo "000")
              echo "Health check attempt $i: HTTP $status"
  
              if [ "$status" -eq 200 ]; then
                echo "Health check passed."
                exit 0
              fi
  
              sleep 5
            done
  
            echo "Health check failed after 10 attempts."
            docker logs lois
            exit 1