<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head th:replace="~{fragments/head :: head('item', ~{::pageResources})}">
    <!-- 페이지 별 리소스 추가 -->
    <th:block th:fragment="pageResources">
        <link rel="stylesheet" th:href="@{/css/index.css}">
        <link rel="stylesheet" th:href="@{/css/dashboard.css}">
        <link rel="stylesheet" th:href="@{/css/supply/item-dashboard.css}">
    </th:block>
</head>

<body>
    <div class="wrap">
        <!-- 공통 헤더 -->
        <header th:replace="~{fragments/header :: header}"></header>

        <main>
            <!-- 왼쪽: 상품 등록 -->
            <section class="stock-left">

                <h2 class="section-title">비품 등록</h2>

                <form class="item-form" th:action="@{/items}" method="post" enctype="multipart/form-data">

                    <!-- 카테고리 선택 박스 -->
                    <div class="item-form-block">
                        <label class="item-form-label" for="category">카테고리 선택</label>
                        <select id="category" name="categoryId" class="item-form-input">
                            <option value="">카테고리 선택</option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.categoryName}">
                            </option>
                        </select>
                    </div>

                    <!-- 상품 이름 박스 -->
                    <div class="item-form-block">
                        <label class="item-form-label" for="itemName">상품 이름</label>
                        <input id="itemName" name="itemName" type="text" class="item-form-input" placeholder="상품 이름" />
                    </div>

                    <!-- 사진 추가 큰 박스 -->
                    <div class="item-form-photo">
                        <span class="item-form-photo-text">사진 추가</span>
                        <input type="file" name="imageFile" class="item-form-photo-input"
                            onclick="alert('준비 중입니다.'); return false;">
                    </div>

                    <!-- 등록 버튼 -->
                    <button type="submit" class="item-form-submit">
                        등록
                    </button>
                </form>

            </section>


            <!-- 오른쪽: Item 목록 -->
            <section class="stock-right">

                <!-- 카테고리 필터 -->
                <div class="filters">
                    <button class="chip" hx-get="/items?category=전체" hx-target=".item-grid" hx-swap="innerHTML">
                        전체
                    </button>

                    <button class="chip" hx-get="/items?category=케이크" hx-target=".item-grid" hx-swap="innerHTML">
                        케이크
                    </button>

                    <button class="chip" hx-get="/items?category=음료" hx-target=".item-grid" hx-swap="innerHTML">
                        음료
                    </button>

                    <button class="chip" hx-get="/items?category=기타" hx-target=".item-grid" hx-swap="innerHTML">
                        기타
                    </button>

                    <button class="chip" hx-get="/items?category=베이킹" hx-target=".item-grid" hx-swap="innerHTML">
                        베이킹
                    </button>
                </div>

                <div class="item-grid">

                    <form th:each="item : ${items}" hx-swap="none">
                        <input type="hidden" name="itemId" th:value="${item.id}" />

                        <button type="submit" class="item-button" th:text="${item.itemName}">
                        </button>
                    </form>

                </div>
            </section>
        </main>

        <!-- 공통 푸터 -->
        <header th:replace="~{fragments/footer :: footer}"></header>
    </div>
</body>

</html>
