<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lois – Cake Reservations</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">

    <script src="https://unpkg.com/htmx.org@1.9.12"></script>

    <script>
        function showPreparing(){ alert("준비 중입니다."); }

    </script>


    <style>
        /* 🔥 여기부터는 stockRequest 전용 최소한의 레이아웃만 추가 */

        /* 전체 두 단 레이아웃 */
        .stock-grid-layout {
            display: grid;
            grid-template-columns: 1.1fr 1.4fr;
            gap: 32px;
            margin-top: 24px;
        }

        /* 왼쪽 리스트 */
        .stock-left {
            display: flex;
            flex-direction: column;
        }

        .request-row {
            display: grid;
            grid-template-columns: 1fr 70px;
            gap: 12px;
            padding: 12px;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 14px;
        }

        .request-main {
            border: none;
            background: transparent;
            text-align: left;
            font-size: 15px;
            color: var(--ink);
        }

        .request-delete {
            border: none;
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--accent);
            padding: 8px 0;
            box-shadow: var(--shadow);
            cursor: pointer;
        }

        .request-actions {
            display: flex;
            gap: 16px;
            margin-top: auto;
            margin-top: 20px;
        }

        .action-button {
            flex: 1;
            border: none;
            background: var(--surface);
            color: var(--accent);
            padding: 14px 0;
            border-radius: var(--radius-cta);
            box-shadow: var(--shadow);
            font-size: 16px;
            cursor: pointer;
        }

        /* 오른쪽 아이템 영역 */
        .stock-right {
            display: flex;
            flex-direction: column;
        }

        /* chip은 기존 .chip 사용 */
        .item-grid {
            margin-top: 16px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        .item-button {
            border: none;
            padding: 14px 0;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            font-size: 15px;
            color: var(--ink);
            cursor: pointer;
        }


        .request-main {
    display: flex;                     /* 가로로 나란히 */
    justify-content: space-between;     /* 좌우 끝으로 배치 */
    align-items: center;               /* 세로 가운데 정렬 */
    width: 100%;
    padding: 12px 15px;
    border: none;
    background: white;
}

.request-item-name {
    font-size: 16px;
    font-weight: 600;
}

.request-days {
    font-size: 14px;
    color: #555;
}
    </style>

</head>

<body>
<div class="wrap">


    <!-- ✨ 공통 헤더 -->
    <header th:replace="~{fragments/header :: site-header}"></header>

    <main>


    <!-- ✨ 본문 두 단 구성 -->
    <!-- 왼쪽: 상품 등록 -->
    <section class="stock-left">

        <h2 class="section-title">상품 등록</h2>

        <form class="item-form"
              th:action="@{/items}"
              method="post"
              enctype="multipart/form-data">

            <!-- 카테고리 선택 박스 -->
            <div class="item-form-block">
                <label class="item-form-label" for="category">카테고리 선택</label>
                <select id="category" name="categoryId" class="item-form-input">
                    <option value="">카테고리 선택</option>
                    <option th:each="cat : ${categories}"
                            th:value="${cat.id}"
                            th:text="${cat.categoryName}">
                    </option>
                </select>
            </div>

            <!-- 상품 이름 박스 -->
            <div class="item-form-block">
                <label class="item-form-label" for="itemName">상품 이름</label>
                <input id="itemName"
                       name="itemName"
                       type="text"
                       class="item-form-input"
                       placeholder="상품 이름"/>
            </div>

            <!-- 사진 추가 큰 박스 -->
            <div class="item-form-photo">
                <span class="item-form-photo-text">사진 추가</span>
                <input type="file"
                       name="imageFile"
                       class="item-form-photo-input">
            </div>

            <!-- 등록 버튼 -->
            <button type="submit" class="item-form-submit">
                등록
            </button>
        </form>

    </section>


        <!-- 오른쪽: Item 목록 -->
        <section class="stock-right">

            <!-- 카테고리 필터 -->
            <div class="filters">
                <button class="chip"
                        hx-get="/items?category=전체"
                        hx-target=".item-grid"
                        hx-swap="innerHTML">
                    전체
                </button>

                <button class="chip"
                        hx-get="/items?category=케이크"
                        hx-target=".item-grid"
                        hx-swap="innerHTML">
                    케이크
                </button>

                <button class="chip"
                        hx-get="/items?category=음료"
                        hx-target=".item-grid"
                        hx-swap="innerHTML">
                    음료
                </button>

                <button class="chip"
                        hx-get="/items?category=기타"
                        hx-target=".item-grid"
                        hx-swap="innerHTML">
                    기타
                </button>

                <button class="chip"
                        hx-get="/items?category=베이킹"
                        hx-target=".item-grid"
                        hx-swap="innerHTML">
                    베이킹
                </button>
            </div>

            <div class="item-grid">

                <form th:each="item : ${items}"
                      hx-swap="none">
                    <input type="hidden" name="itemId" th:value="${item.id}"/>

                    <button type="submit"
                            class="item-button"
                            th:text="${item.itemName}">
                    </button>
                </form>

            </div>

        </section>
    </section>


    </main>
    <!-- ✨ 공통 푸터 -->
    <header th:replace="~{fragments/footer :: site-footer}"></header>

</div>

</body>
</html>
