<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head th:replace="~{fragments/head :: commonHead('request-dashboard', ~{::extraHead})}">
</head>

<body>
<!-- 페이지별 head 추가 요소 -->
<th:block th:remove="all">
    <th:block th:fragment="extraHead">
        <link rel="stylesheet" th:href="@{/css/index.css}">
        <link rel="stylesheet" th:href="@{/css/common-dashboard.css}">
        <link rel="stylesheet" th:href="@{/css/request-dashboard.css}">

        <script th:src="@{/js/request.js}" defer></script>
        <script th:src="@{/js/auth-common.js}" defer></script>
    </th:block>
</th:block>

<div class="wrap">
    <!-- ✨ 공통 헤더 -->
    <header th:replace="~{fragments/header :: site-header}"></header>

    <main>
    <!-- ✨ 본문 두 단 구성 -->
    <section class="content stock-grid-layout">

        <!-- 왼쪽: Stock Requests -->
        <section class="stock-left">

            <h2 class="section-title">주문 요청</h2>

            <!-- 요청 리스트 -->
            <div th:each="req : ${stockRequests}"
                 class="request-row"
                 th:attr="id='stock-request-' + ${req.id}">

                <button type="button" class="request-main" th:hx-get="@{'/stock-requests/{id}'(id=${req.id})}"
                        hx-target="closest .request-row"
                        hx-swap="afterend" hx-trigger="click">
                    <span class="request-item-name"
                          th:text="${req.itemName}">
                    </span>

                        <span class="request-days"
                              th:text="'요청한 지 ' + ${req.daysSinceRequest} + '일 째'">
                        </span>
            </button>

                <button type="button"
                        class="request-delete"
                        th:hx-delete="@{'/stock-requests/' + ${req.id}}"
                        hx-target="closest .request-row"
                        hx-swap="outerHTML">
                    삭제
                </button>
            </div>

            <!-- 문자 / 카톡 -->
            <div class="request-actions" th:attr="data-count=${#lists.size(stockRequests)}">
                <button class="action-button"
                        onclick="sendStockRequestsSms(this)">문자</button>
                <button class="action-button" type="button"
                        onclick="openStockRequestsPrint(this)">프린트</button>
                <button class="action-button">카톡</button>
            </div>
        </section>


        <!-- 오른쪽: Item 목록 -->
        <section class="stock-right">

            <!-- 카테고리 필터 -->
            <div class="filters">
                <button class="chip"
                        hx-get="/items?category=전체"
                        hx-target=".item-grid"
                        hx-swap="innerHTML">
                    전체
                </button>

                <button class="chip"
                        hx-get="/items?category=케이크"
                        hx-target=".item-grid"
                        hx-swap="innerHTML">
                    케이크
                </button>

                <button class="chip"
                        hx-get="/items?category=음료"
                        hx-target=".item-grid"
                        hx-swap="innerHTML">
                    음료
                </button>

                <button class="chip"
                        hx-get="/items?category=스티커"
                        hx-target=".item-grid"
                        hx-swap="innerHTML">
                    스티커
                </button>

                <button class="chip"
                        hx-get="/items?category=베이킹"
                        hx-target=".item-grid"
                        hx-swap="innerHTML">
                    베이킹
                </button>
            </div>

            <!-- 아이템 grid -->
            <div class="item-grid"
                 th:replace="~{stock/fragments-item-grid :: itemGridAll(${top8Items}, ${itemsExceptTop8})}">

                <!-- 🔥 1) 인기 TOP 8 -->
                <form th:each="item : ${top8Items}"
                      hx-post="/api/stock-requests"
                      hx-swap="none">
                    <input type="hidden" name="itemId" th:value="${item.id}"/>

                    <button type="submit"
                            class="item-button item-button--popular"
                            th:text="${item.itemName}">
                    </button>
                </form>

                <div class="item-separator"></div>


                <!-- 🔤 2) 나머지 가나다순 -->
                <form th:each="item : ${itemsExceptTop8}"
                      hx-post="/api/stock-requests"
                      hx-swap="none">
                    <input type="hidden" name="itemId" th:value="${item.id}"/>

                    <button type="submit"
                            class="item-button"
                            th:text="${item.itemName}">
                    </button>
                </form>

            </div>

        </section>
    </section>

    </main>

    <!-- ✨ 공통 푸터 -->
    <footer th:replace="~{fragments/footer :: site-footer}"></footer>

</div>
    <script>
        document.body.addEventListener("alreadyRequested", function () {
            alert("이미 요청된 아이템입니다!");
        });
    </script>
    <script>
        document.body.addEventListener("htmx:beforeRequest", function (event) {
            const btn = event.target;   // 클릭한 버튼
            if (!btn.matches(".request-main")) return;

            const row = btn.closest(".request-row");
            const next = row.nextElementSibling;

            // 이미 상세가 열려 있는 경우: 상세 div이면 접기
            if (next && next.classList.contains("request-detail-card")) {
                next.remove();           // 상세 DOM 삭제
                event.preventDefault();  // 서버 요청 취소 → 접기
            }
        });
    </script>

</body>
</html>
