<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Lois Demo - Reservations</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/common-dashboard.css}">
    <link rel="stylesheet" th:href="@{/css/reservation-dashboard.css}">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script th:src="@{/js/demo-common.js}" defer></script>
    <script th:src="@{/js/demo-reservation.js}" defer></script>
</head>
<body>
<div class="wrap">
    <header th:replace="~{fragments/header :: site-header}"></header>
    <main>
        <div th:replace="~{demo/fragments/demo-notice :: banner}"></div>
        <section class="content">
            <div class="list-header grid-2x2">
                <div class="slot tl">
                    <h2 class="section-title">케이크 예약 리스트</h2>
                </div>
                <div class="slot tr">
                    <a class="cta" th:href="@{/demo/reservations/produce}" role="button">
                        <div class="title">제작완료</div>
                    </a>
                    <a class="cta" th:href="@{/demo/reservations/on-site}" role="button">
                        <div class="title">현장판매</div>
                    </a>
                    <a class="cta" th:href="@{/demo/reservations/simple-reservation}" role="button">
                        <div class="title">간단예약</div>
                    </a>
                    <a class="cta" th:href="@{/demo/reservations/new}" role="button">
                        <div class="title">예약하기</div>
                    </a>
                </div>
                <div class="slot bl">
                    <div class="filters">
                        <button class="chip" type="button"
                                hx-get="/demo/reservations/list" hx-target="#list" hx-swap="innerHTML"
                                hx-vals='{"range":"all"}'>전체</button>
                        <button class="chip" type="button"
                                hx-get="/demo/reservations/list" hx-target="#list" hx-swap="innerHTML"
                                hx-vals='{"range":"from-today"}'>오늘부터</button>
                        <button class="chip" type="button"
                                hx-get="/demo/reservations/list" hx-target="#list" hx-swap="innerHTML"
                                hx-vals='{"range":"today"}'>오늘</button>
                        <button class="chip" type="button" onclick="toggleDatePicker()">날짜</button>
                        <div id="date-popover" class="date-popover hidden">
                            <input type="date" id="pickDate" name="date"
                                   hx-get="/demo/reservations/list"
                                   hx-target="#list"
                                   hx-swap="innerHTML"
                                   hx-trigger="change"
                                   hx-vals='js:{range:"date", date: document.getElementById("pickDate").value}'
                                   autocomplete="off"
                                   hx-on="
                                       change: sessionStorage.setItem('demoReservationDate', this.value);
                                               document.getElementById('date-popover').classList.add('hidden');
                                       htmx:afterSwap: document.getElementById('date-popover').classList.add('hidden')
                                     ">
                        </div>
                    </div>
                </div>
                <div class="slot br">
                    <form class="reservation-search phone-search-form"
                          method="get"
                          th:action="@{/demo/reservations/search}"
                          th:attr="hx-get=@{/demo/reservations/search}"
                          hx-target="#list"
                          hx-swap="innerHTML">
                        <label for="contactSuffix" class="search-label phone-search-label">휴대폰 뒷자리</label>
                        <div class="phone-search-inline">
                            <input id="contactSuffix" name="contactSuffix" type="text"
                                   inputmode="numeric" pattern="[0-9]{4}"
                                   maxlength="4" minlength="4"
                                   class="phone-input" required>
                            <button type="submit" class="phone-search-btn">검색</button>
                        </div>
                    </form>
                </div>
            </div>

            <section class="plan-card">
                <div class="plan-card__head" onclick="togglePlanCard()">
                    <div class="plan-card__title">오늘 생산 계획</div>
                    <div class="plan-card__meta">
                        <span class="plan-card__hint">필요 수량(추가생산)</span>
                        <span id="planCardChevron" class="plan-card__chevron">▾</span>
                    </div>
                </div>
                <div id="planCardBody" class="plan-card__body">
                    <div class="mk-grid">
                        <div th:each="size : ${cakeSizes}" class="mk-row">
                            <div class="mk-size" th:text="${size + '호'}"></div>
                            <div class="mk-flavors">
                                <div class="mk-flavor"
                                     th:each="e : ${flavors}"
                                     th:with="cakeId=${e.id}, name=${e.name}, css=${'mk-' + e.code}">
                                    <div class="mk-flavor-head">
                                        <span class="mk-chip" th:classappend="${css}" aria-hidden="true"></span>
                                        <span class="mk-name" th:text="${name}"></span>
                                    </div>
                                    <div class="mk-values">
                                        <span class="mk-badge mk-need">
                                            필요 <b th:text="${toMakeMap != null and toMakeMap.get(size) != null and toMakeMap.get(size).get(cakeId) != null ? toMakeMap.get(size).get(cakeId) : 0}">0</b>
                                        </span>
                                        <span class="mk-badge mk-stock">
                                            재고 <b th:text="${stockMap != null and stockMap.get(size) != null and stockMap.get(size).get(cakeId) != null ? stockMap.get(size).get(cakeId) : 0}">0</b>
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <div class="reservation-toolbar">
                <div class="reservation-legend">
                    <span class="legend-chip legend-sameday"></span>
                    <span>오늘 생성된 예약</span>
                </div>
                <div class="sorts" id="sorts">
                    <button type="button"
                            class="chip chip--sub pickup-filter-btn hidden"
                            data-show="today"
                            th:attr="hx-get=@{/demo/reservations/list?sort=waiting}"
                            hx-target="#list"
                            hx-swap="innerHTML">픽업예정</button>
                    <button type="button"
                            class="chip chip--sub pickup-filter-btn hidden"
                            data-show="today from-today date"
                            th:attr="hx-get=@{/demo/reservations/list?sort=created-at}"
                            hx-target="#list"
                            hx-swap="innerHTML">등록순</button>
                </div>
            </div>

            <div class="thead">
                <div>연번</div>
                <div>날짜</div>
                <div>시간</div>
                <div>맛</div>
                <div>호수</div>
                <div>연락처</div>
                <div>결제</div>
                <div>픽업</div>
                <div>수정/삭제</div>
            </div>

            <div id="list" th:fragment="list">
                <div th:each="r, stat : ${reservations}" th:with="rowNo=${stat.count}"
                     th:insert="~{demo/fragments/reservation-row :: rowFragment(r=${r}, rowNo=${rowNo})}">
                </div>
                <div th:if="${range == 'today' or range == 'date'}" class="list-print-actions">
                    <button type="button"
                            class="chip"
                            th:onclick="|window.open('@{/demo/reservations/print(range=${range}, date=${date})}', '_blank')|">
                        <span th:text="${range == 'today' ? '오늘 케이크 리스트 인쇄' : '선택일 케이크 리스트 인쇄'}"></span>
                    </button>
                </div>
            </div>
        </section>
    </main>
    <footer th:replace="~{fragments/footer :: site-footer}"></footer>
</div>

<div id="confirm-modal" class="confirm-modal hidden">
    <div class="confirm-modal__content">
        <p class="confirm-modal__text">정말 이 예약을 삭제하시겠어요?</p>
        <div class="confirm-modal__actions">
            <button id="confirm-yes" class="confirm-modal__btn confirm-modal__btn--yes">예</button>
            <button id="confirm-no" class="confirm-modal__btn confirm-modal__btn--no">아니오</button>
        </div>
    </div>
</div>
</body>
</html>
