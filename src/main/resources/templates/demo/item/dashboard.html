<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Lois Demo - Item Management</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/common-dashboard.css}">

    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script th:src="@{/js/demo-common.js}" defer></script>

    <style>
        .item-demo-layout {
            display: grid;
            grid-template-columns: minmax(260px, 0.75fr) minmax(0, 1.25fr);
            gap: 32px;
            margin-top: 24px;
        }

        .item-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 420px;
        }

        .item-form-block {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .item-form-label {
            font-size: 14px;
            color: var(--muted);
        }

        .item-form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        .item-form-submit {
            border: none;
            border-radius: var(--radius-cta);
            background: var(--accent);
            color: #fff;
            padding: 13px 0;
            box-shadow: var(--shadow);
            font-size: 16px;
            cursor: pointer;
        }

        .item-grid {
            margin-top: 16px;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
        }

        .item-card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 14px;
            min-height: 74px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
        }

        .item-card__name {
            font-size: 15px;
            font-weight: 700;
            color: var(--ink);
            word-break: keep-all;
            overflow-wrap: anywhere;
        }

        .item-card__meta {
            font-size: 13px;
            color: var(--muted);
        }

        @media (max-width: 760px) {
            .item-demo-layout {
                grid-template-columns: 1fr;
            }

            .item-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>
</head>
<body>
<div class="wrap">
    <header th:replace="~{fragments/header :: site-header}"></header>

    <main>
        <div th:replace="~{demo/fragments/demo-notice :: banner}"></div>

        <section class="content item-demo-layout">
            <section class="stock-left">
                <h2 class="section-title">상품 등록 Demo</h2>

                <form class="item-form" th:action="@{/demo/items}" method="post">
                    <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="item-form-block">
                        <label class="item-form-label" for="category">카테고리 선택</label>
                        <select id="category" name="categoryId" class="item-form-input" required>
                            <option value="">카테고리 선택</option>
                            <option th:each="cat : ${categories}"
                                    th:value="${cat.id}"
                                    th:text="${cat.categoryName}">
                            </option>
                        </select>
                    </div>

                    <div class="item-form-block">
                        <label class="item-form-label" for="itemName">상품 이름</label>
                        <input id="itemName"
                               name="itemName"
                               type="text"
                               class="item-form-input"
                               placeholder="상품 이름"
                               required/>
                    </div>

                    <button type="submit" class="item-form-submit">등록</button>
                </form>
            </section>

            <section class="stock-right">
                <h2 class="section-title">상품 목록 Demo</h2>

                <div class="filters">
                    <button class="chip" hx-get="/demo/items/grid?category=전체" hx-target=".item-grid" hx-swap="innerHTML">전체</button>
                    <button class="chip" hx-get="/demo/items/grid?category=케이크" hx-target=".item-grid" hx-swap="innerHTML">케이크</button>
                    <button class="chip" hx-get="/demo/items/grid?category=음료" hx-target=".item-grid" hx-swap="innerHTML">음료</button>
                    <button class="chip" hx-get="/demo/items/grid?category=스티커" hx-target=".item-grid" hx-swap="innerHTML">스티커</button>
                    <button class="chip" hx-get="/demo/items/grid?category=베이킹" hx-target=".item-grid" hx-swap="innerHTML">베이킹</button>
                </div>

                <div class="item-grid" th:replace="~{demo/item/fragments-item-grid :: itemGrid(${items})}">
                </div>
            </section>
        </section>
    </main>

    <footer th:replace="~{fragments/footer :: site-footer}"></footer>
</div>
</body>
</html>
