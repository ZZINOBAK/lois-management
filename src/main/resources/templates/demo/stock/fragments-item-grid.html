<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>
<div class="item-grid" th:fragment="itemGridAll(top8Items, itemsExceptTop8)">
    <form th:each="item : ${top8Items}"
          hx-post="/demo/stock-requests"
          hx-swap="none">
        <input type="hidden" name="itemId" th:value="${item.id}"/>
        <button type="submit"
                class="item-button item-button--popular"
                th:text="${item.itemName}">
        </button>
    </form>

    <div class="item-separator"></div>

    <form th:each="item : ${itemsExceptTop8}"
          hx-post="/demo/stock-requests"
          hx-swap="none">
        <input type="hidden" name="itemId" th:value="${item.id}"/>
        <button type="submit"
                class="item-button"
                th:text="${item.itemName}">
        </button>
    </form>
</div>

<div class="item-grid" th:fragment="itemGridCategory(items)">
    <form th:each="item : ${items}"
          hx-post="/demo/stock-requests"
          hx-swap="none">
        <input type="hidden" name="itemId" th:value="${item.id}"/>
        <button type="submit"
                class="item-button"
                th:text="${item.itemName}">
        </button>
    </form>
</div>
</body>
</html>
