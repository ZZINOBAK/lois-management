<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>stock-requests-print-demo</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <style>
        @media print { @page { size: 80mm auto; margin: 5mm 3mm; } html, body { width: 80mm; margin: 0; padding: 0; } .actions { display: none !important; } }
        body { font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 20px; line-height: 1.5; }
        .title { text-align: center; font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .date { text-align: center; font-size: 18px; margin-bottom: 10px; }
        .divider { border-top: 1px dashed #000; margin: 8px 0 12px; }
        .receipt-category { font-weight: 900; font-size: 20px; margin: 10px 0 6px; }
    </style>
</head>
<body onload="window.print()">
<div class="title">재고 부족 리스트 Demo</div>
<div class="date" th:text="${#temporals.format(printedAt, 'yyyy-MM-dd HH:mm')}"></div>
<div class="divider"></div>

<div th:if="${stockRequests == null || #lists.isEmpty(stockRequests)}">
    <div class="receipt-row"><div class="receipt-name">요청 없음</div></div>
</div>

<div th:each="req, stat : ${stockRequests}">
    <div class="receipt-category"
         th:if="${stat.index == 0 or stockRequests[stat.index-1].categoryName != req.categoryName}"
         th:text="${'[' + req.categoryName + ']'}">[베이킹]</div>
    <div class="receipt-row">
        <div class="receipt-name" th:text="${'- ' + req.itemName}">- 박스(대)</div>
    </div>
</div>
</body>
</html>
