<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}">
    <title>Lois Demo</title>
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script th:src="@{/js/demo-common.js}" defer></script>
</head>
<body>
<div class="wrap">
    <header th:replace="~{fragments/header :: site-header}"></header>
    <main>
        <section class="grid">
            <div class="card" th:onclick="|location.href='@{/demo/reservations}'|">
                <div class="card__title">Reservation Demo</div>
                <div class="card__sub">케이크 예약 둘러보기</div>
            </div>
            <div class="card" th:onclick="|location.href='@{/demo/stock-requests}'|">
                <div class="card__title">Stock Request Demo</div>
                <div class="card__sub">재고 주문 요청 둘러보기</div>
            </div>
            <div class="card" onclick="showPreparing()">
                <div class="card__title">Check In</div>
                <div class="card__sub">Demo 제외</div>
            </div>
            <div class="card" onclick="showPreparing()">
                <div class="card__title">Check Out</div>
                <div class="card__sub">Demo 제외</div>
            </div>
        </section>
    </main>
    <footer th:replace="~{fragments/footer :: site-footer}"></footer>
</div>
</body>
</html>
