<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head th:replace="~{fragments/head :: head('cake-reserve', ~{::pageResources})}">
    <!-- 페이지 별 리소스 추가 -->
    <th:block th:fragment="pageResources">
        <link rel="stylesheet" th:href="@{/css/index.css}">
        <link rel="stylesheet" th:href="@{/css/cake/steps1.css}">
    </th:block>
</head>

<body>
    <div class="wrap">
        <!-- 공통 헤더 -->
        <header th:replace="~{fragments/header :: header}"></header>

        <main>
            <div th:if="${reservationError}" class="reservation-error" th:text="${reservationError}"
                style="margin:12px;padding:12px;border:1px solid #c00;color:#c00;background:#fff5f5;">
            </div>
            <div id="step-container" hx-get="/reservations/step/1" hx-trigger="load" hx-target="#step-container"
                hx-swap="innerHTML">
                <!-- 조각(fragment)이 삽입됨 -->
            </div>
        </main>

        <!-- 공통 푸터 -->
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</body>

</html>
