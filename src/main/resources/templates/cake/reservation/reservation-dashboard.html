<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head th:replace="~{fragments/head :: head('Cake Reservations', ~{::pageResources})}">
    <!-- 페이지 별 리소스 추가 -->
    <th:block th:fragment="pageResources">
        <link rel="stylesheet" th:href="@{/css/index.css}">
        <link rel="stylesheet" th:href="@{/css/common-dashboard.css}">
        <link rel="stylesheet" th:href="@{/css/cake/reservation-dashboard.css}">

        <script th:src="@{/js/auth/auth-common.js}" defer></script>
        <script th:src="@{/js/cake/reservation/reservation.js}" defer></script>
        <script th:src="@{/js/cake/reservation/reservation-stock-panel.js}" defer></script>
        <script th:src="@{/js/cake/reservation/reservation-pickup.js}" defer></script>
        <script th:src="@{/js/cake/reservation/reservation-footer.js}" defer></script>
    </th:block>
</head>

<body>
    <div class="wrap reservation-dashboard">
        <!-- 공통 헤더 -->
        <header th:replace="~{fragments/header :: header}"></header>

        <!-- 이 페이지 내용 -->
        <main>
            <p class="reservation-pickup-toast" data-pickup-feedback role="status" aria-live="polite" hidden></p>
            <section class="content">
                <!-- 🔹 레전드(왼쪽) + 검색폼(오른쪽) 한 줄 -->
                <div class="list-header grid-2x2">
                    <!-- 왼쪽 위 -->
                    <div class="slot tl">
                        <h2 class="section-title">케이크 예약 리스트</h2>
                    </div>
                    <!-- 오른쪽 위 -->
                    <div class="slot tr">
                        <a class="cta" th:href="@{/cake-production}" role="button">
                            <div class="title">제작 관리</div>
                        </a>
                        <a class="cta" th:href="@{/reservations/on-site}" role="button">
                            <div class="title">현장판매</div>
                        </a>
                        <a class="cta" th:href="@{/reservations/simple-reservation}" role="button">
                            <div class="title">간단예약</div>
                        </a>
                        <a class="cta" th:href="@{/reservations/new}" role="button">
                            <div class="title">예약하기</div>
                        </a>
                    </div>
                    <!-- 왼쪽 아래 -->
                    <div class="slot bl">
                        <div class="filters">
                            <button class="chip" type="button" data-range="today" aria-pressed="true"
                                hx-get="/reservations/list" hx-target="#list" hx-swap="innerHTML"
                                hx-vals='{"range":"today"}'>
                                오늘
                            </button>
                            <button class="chip" type="button" data-range="from-today" aria-pressed="false"
                                hx-get="/reservations/list" hx-target="#list" hx-swap="innerHTML"
                                hx-vals='{"range":"from-today"}'>
                                오늘부터
                            </button>
                            <button class="chip" type="button" data-range="date" aria-pressed="false"
                                onclick="toggleDatePicker()">
                                날짜
                            </button>
                            <button class="chip" type="button" data-range="all" aria-pressed="false"
                                hx-get="/reservations/list" hx-target="#list" hx-swap="innerHTML"
                                hx-vals='{"range":"all"}'>
                                전체
                            </button>
                            <button class="chip" type="button" data-stock-panel-toggle aria-expanded="false"
                                aria-controls="reservation-stock-panel">제작현황</button>
                            <div id="date-popover" class="date-popover hidden">
                                <input type="date" id="pickDate" name="date" hx-get="/reservations/list"
                                    hx-target="#list" hx-swap="innerHTML" hx-trigger="change"
                                    hx-vals='js:{range:"date", date: document.getElementById("pickDate").value}'
                                    autocomplete="off" hx-on="
                                           change: sessionStorage.setItem('reservationDate', this.value);
                                                   document.getElementById('date-popover').classList.add('hidden');
                                           htmx:afterSwap: document.getElementById('date-popover').classList.add('hidden')
                                         ">
                            </div>
                        </div>
                    </div>
                    <!-- 오른쪽 아래 -->
                    <div class="slot br">
                        <form class="reservation-search phone-search-form" method="get"
                            th:action="@{/reservations/search}" th:attr="hx-get=@{/reservations/search}"
                            hx-target="#list" hx-swap="innerHTML">
                            <label for="contactSuffix" class="search-label phone-search-label">휴대폰 뒷자리</label>
                            <div class="phone-search-inline">
                                <input id="contactSuffix" name="contactSuffix" type="text" inputmode="numeric"
                                    pattern="[0-9]{4}" maxlength="4" minlength="4" class="phone-input" required>
                                <button type="submit" class="phone-search-btn">검색</button>
                            </div>
                        </form>
                    </div>
                </div>

                <section id="reservation-stock-panel" class="reservation-stock-panel" data-stock-panel hidden
                    aria-labelledby="reservation-stock-panel-title"
                    th:attr="data-needs-url=@{/cake-production/production-needs},data-produce-url=@{/cake-stocks/produce},data-cancel-url=@{/cake-stocks/produce-cancel}">
                    <h3 id="reservation-stock-panel-title">제작현황 <span>2호</span></h3>
                    <p data-stock-panel-status role="status" aria-live="polite"></p>
                    <div class="reservation-stock-panel-grid" data-stock-panel-items></div>
                </section>

                <div class="reservation-dashboard-layout">
                    <div class="reservation-dashboard-production">
                        <!-- ✅ 생산 계획 카드 조각: 여기부터 -->
                        <div th:replace="~{cake/production/fragments/production-status :: productionStatus}">
                        </div>

                    </div>
                    <div class="reservation-dashboard-reservations">
                        <!-- 테이블 헤드 상단: 오늘 생성된 예약, 픽업예정 등 -->
                        <div class="reservation-toolbar">
                            <div class="reservation-legend">
                                <span class="legend-chip legend-sameday"></span>
                                <span>오늘 생성된 예약</span>
                            </div>


                            <div class="sorts" id="sorts">
                                <!-- 📦 픽업예정만 보기 버튼 (이건 그대로 아래에 둠) -->
                                <button type="button" class="chip chip--sub pickup-filter-btn hidden" data-show="today"
                                    th:attr="hx-get=@{/reservations/list?sort=waiting}" hx-target="#list"
                                    hx-swap="innerHTML">
                                    픽업예정
                                </button>
                                <button type="button" class="chip chip--sub pickup-filter-btn hidden"
                                    data-show="today from-today date"
                                    th:attr="hx-get=@{/reservations/list?sort=created-at}" hx-target="#list"
                                    hx-swap="innerHTML">
                                    등록순
                                </button>
                            </div>
                        </div>

                        <!-- 헤더와 행을 같은 필터 상태 및 Grid로 갱신 -->
                        <div id="list" th:fragment="list">
                            <div class="reservation-list"
                                th:classappend="${range == 'today'} ? ' reservation-list--today' : ''">
                                <div class="thead">
                                    <div>연번</div>
                                    <div class="reservation-date">날짜</div>
                                    <div>시간</div>
                                    <div>맛</div>
                                    <div>호수</div>
                                    <div>결제</div>
                                    <div>픽업</div>
                                    <div>뒤 4자리</div>
                                </div>
                                <!-- 행 반복 -->
                                <!--  조각 insert rowFragment(r) -->
                                <div th:each="r, stat : ${reservations}" th:with="rowNo=${stat.count}"
                                    th:insert="~{reservation/fragments/reservation-row :: rowFragment(r=${r}, rowNo=${rowNo})}">

                                </div>
                                <!-- ✅ 오늘(scope == 'today')일 때만 인쇄 버튼 보이기 -->
                                <div th:if="${range == 'today' or range == 'date'}" class="list-print-actions">
                                    <button type="button" class="chip"
                                        th:onclick="|window.open('@{/reservations/print(range=${range}, date=${date})}', '_blank')|">
                                        <span th:text="${range == 'today' ? '오늘 케이크 리스트 인쇄' : '선택일 케이크 리스트 인쇄'}"></span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- 공통 푸터 -->
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>

    <!-- 모달 영역 -->
    <!-- 삭제 확인 모달 -->
    <div id="confirm-modal" class="confirm-modal hidden">
        <div class="confirm-modal__content">
            <p class="confirm-modal__text">정말 이 예약을 삭제하시겠어요?</p>
            <div class="confirm-modal__actions">
                <button id="confirm-yes" class="confirm-modal__btn confirm-modal__btn--yes">
                    예
                </button>
                <button id="confirm-no" class="confirm-modal__btn confirm-modal__btn--no">
                    아니오
                </button>
            </div>
        </div>
    </div>
    <!-- 픽업 취소 모달 -->
    <dialog class="pickup-cancel-dialog" data-pickup-cancel-dialog aria-labelledby="pickup-cancel-title">
        <h2 id="pickup-cancel-title">픽업을 취소하는 이유를 선택해 주세요</h2>
        <div class="pickup-cancel-options">
            <button type="button" class="pickup-cancel-option" data-cancel-reason="MISTAKE">
                <svg viewBox="0 0 120 100" aria-hidden="true" focusable="false">
                    <path d="M18 85h84M26 82V53h68v29M26 60q8-12 17 0t17 0t17 0t17 0" />
                    <path d="M60 51V32m0-8c-10-7 0-17 0-17s10 10 0 17" />
                    <path d="M88 18h22m-6-6 6 6-6 6" />
                </svg>
                <strong>아직 픽업 전이에요</strong>
                <span>픽업 완료 처리를 되돌려요.</span>
            </button>
            <button type="button" class="pickup-cancel-option" data-cancel-reason="RETURNED">
                <svg viewBox="0 0 120 100" aria-hidden="true" focusable="false">
                    <path d="M35 64V41h50v23M35 48q6-9 13 0t13 0t13 0t11 0M60 39V26" />
                    <path d="M15 88l17-15h36q12 0 12 8H49m30 0 20-16q10-5 13 2L86 92H36" />
                    <path d="M88 12H49m9-8-9 8 9 8" />
                </svg>
                <strong>케이크를 돌려받았어요</strong>
                <span>돌려받은 케이크를 재고에 추가해요.</span>
            </button>
        </div>
        <button type="button" class="btn" data-cancel-dismiss>닫기</button>
    </dialog>
</body>

</html>
