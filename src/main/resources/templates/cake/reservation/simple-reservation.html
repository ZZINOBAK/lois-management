<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head th:replace="~{fragments/head :: head('간단 예약', ~{::pageResources})}">
    <!-- 페이지 별 리소스 추가 -->
    <th:block th:fragment="pageResources">
        <link rel="stylesheet" th:href="@{/css/index.css}">
        <link rel="stylesheet" th:href="@{/css/common-dashboard.css}">
        <link rel="stylesheet" th:href="@{/css/cake/reservation-dashboard.css}">
        <link rel="stylesheet" th:href="@{/css/cake/on-site.css}">
        <link rel="stylesheet" th:href="@{/css/cake/simple-reservation.css}">

        <script th:src="@{/js/cake/reservation/simple-reservation.js}" defer></script>
    </th:block>
</head>

<body>
    <div class="wrap">
        <!-- 공통 헤더 -->
        <header th:replace="~{fragments/header :: header}"></header>

        <!-- 이 페이지 내용 -->
        <main>
            <div th:if="${reservationError}" class="reservation-error" th:text="${reservationError}"
                style="margin:12px;padding:12px;border:1px solid #c00;color:#c00;background:#fff5f5;">
            </div>

            <form th:action="@{/reservations/simple-reservation}" method="post" class="step-form">

                <!-- =========================
                 1) 케이크 선택
            ========================== -->
                <div class="section-head">
                    <h2 class="title">케이크 선택</h2>
                </div>

                <div class="grid cake-grid">
                    <label class="option" th:each="c : ${cakes}">
                        <input type="radio" name="cakeId" th:value="${c.id}" required />
                        <div class="card">
                            <div class="card__title" th:text="${c.flavor}">딸기 생크림</div>
                        </div>
                    </label>
                </div>


                <!-- =========================
                 2) 호수 선택
            ========================== -->
                <div class="section-head" style="margin-top: 18px;">
                    <h2 class="title">호수 선택</h2>
                </div>

                <div class="grid size-grid">
                    <label class="option">
                        <input type="radio" name="cakeSize" value="1" required />
                        <div class="card">
                            <div class="card__title">1호</div>
                        </div>
                    </label>
                    <label class="option">
                        <input type="radio" name="cakeSize" value="2" />
                        <div class="card">
                            <div class="card__title">2호</div>
                        </div>
                    </label>
                    <!-- 필요하면 4호/미니 등 추가 -->
                </div>


                <!-- =========================
         3) 픽업 시간
    ========================== -->

                <div class="section-head">
                    <h2 class="title">픽업 시간</h2>
                </div>

                <!-- 서버로 전송될 값 -->
                <input type="hidden" name="pickupTime" id="picked-time" required>

                <!-- 시 선택 -->
                <div class="time-section">
                    <div class="time-label">시</div>
                    <div class="time-grid" id="hour-grid"></div>
                </div>

                <!-- 분 선택 -->
                <div class="time-section">
                    <div class="time-label">분</div>
                    <div class="time-grid" id="minute-grid"></div>
                </div>

                <!-- =========================
                 4) 연락처 뒤 4자리
            ========================== -->
                <div class="section-head" style="margin-top: 18px;">
                    <h2 class="title">연락처 뒤 4자리</h2>
                </div>

                <div class="grid">
                    <input type="text" name="contactSuffix" maxlength="4" pattern="\d{4}" placeholder="예) 1234" required
                        class="input" />
                </div>

                <!-- =========================
                 5) 결제 여부
            ========================== -->
                <div class="section-head" style="margin-top: 18px;">
                    <h2 class="title">결제 여부</h2>
                </div>

                <div class="grid">
                    <label class="option">
                        <input type="radio" name="paid" value="true" required />
                        <div class="card">
                            <div class="card__title">결제완료</div>
                        </div>
                    </label>

                    <label class="option">
                        <input type="radio" name="paid" value="false" />
                        <div class="card">
                            <div class="card__title">미결제</div>
                        </div>
                    </label>
                </div>


                <!-- =========================
                 6) 당일예약 여부
            ========================== -->
                <div class="section-head" style="margin-top: 18px;">
                    <h2 class="title">당일예약</h2>
                </div>

                <div class="grid">
                    <label class="option">
                        <input type="checkbox" name="sameDay" value="true" />
                        <div class="card">
                            <div class="card__title">당일예약</div>
                        </div>
                    </label>
                </div>



                <!-- =========================
                 3) 메모
            ========================== -->
                <div class="section-head" style="margin-top: 18px;">
                    <h2 class="title">메모</h2>
                </div>

                <div class="note-box">
                    <textarea name="note" rows="4" placeholder="예) 초 5개, 문구: 생일축하해, 픽업 전 전화 부탁"
                        class="note-input"></textarea>
                </div>

                <!-- =========================
                 4) 완료 버튼
            ========================== -->
                <div class="actions">
                    <button type="submit" class="btn primary">완료</button>
                </div>
            </form>
        </main>

        <!-- 공통 푸터 -->
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</body>

</html>
