<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>

<!-- 조각 rowFragment(r) 시작 -->
<div th:fragment="rowFragment(r, rowNo)" data-reservation-row th:attr="data-reservation-id=${r.id}, data-status=${r.status}" th:id="'row-block-' + ${r.id}">

    <!-- 요약 행 -->
    <div class="row summary-row" data-reservation-summary
         th:id="'row-' + ${r.id}"
         th:onclick="|toggleDetailRow(event, ${r.id})|"
         th:classappend="${r.status == 'PICKED_UP'} ? ' picked' : ''"
         th:attr="data-sameday=${r.createdAt != null
                                     and #temporals.format(r.createdAt, 'yyyy-MM-dd') == #temporals.format(today, 'yyyy-MM-dd')},
                data-row-no=${rowNo}">
        <!--                                <div th:text="${r.rowNumber}"></div>&lt;!&ndash; 연번 &ndash;&gt;-->
        <div class="row-no" th:text="${rowNo}"></div> <!-- 연번 -->
        <div class="reservation-date" th:text="${#temporals.format(r.resDate, 'M월 d일')}"></div><!-- 예약일 -->
        <div th:text="${#temporals.format(r.resTime, 'HH:mm')}"></div><!-- 픽업시간 -->
        <span class="reservation-flavor ellipsis" th:text="${r.cakeFlavor}"></span>
        <div th:text="${r.cakeSize + '호'}"></div><!-- 케이크 사이즈 -->
        <div><!-- 결제 여부 -->
            <span th:classappend="${r.paid} ? 'badge-paid' : 'badge-unpaid'">
                                        <span th:text="${r.paid} ? '결제완료' : '미결제'"></span>
                                    </span>
        </div>
        <div class="pickup-cell"><!-- 픽업 상태 버튼 -->
            <div class="pickup-cell">
                <button type="button" class="btn pickup-btn" data-reservation-pickup
                        th:classappend="${r.status == 'PICKED_UP'} ? ' picked-btn' : ''"
                        th:attr="data-pickup-url=@{/api/reservations/pickup/{id}(id=${r.id})}, data-cancel-url=@{/api/reservations/pickup-cancel/{id}(id=${r.id})}">
                    <span data-pickup-label th:text="${r.status == 'PICKED_UP' ? '픽업완료' : '픽업예정'}"></span>
                </button>
            </div>
        </div>

        <div class="phone" th:text="${r.contactSuffix}"></div><!-- 뒤 4자리 -->
    </div>
    <!-- 상세 행 -->
    <div class="detail-row hidden"
         th:id="'detail-' + ${r.id}">
        <div><b>예약 날짜:</b> <span th:text="${#temporals.format(r.resDate, 'yyyy-MM-dd')}"></span></div>
        <div><b>전체 연락처:</b> <span th:text="${r.contact}"></span></div>
        <div><b>요청사항:</b> <span th:text="${r.note}"></span></div>
        <div><b>초:</b> <span th:text="${r.candles}"></span></div>
        <div data-pickup-time th:if="${r.status == 'PICKED_UP' and r.pickedUpAt != null}"><b>픽업시간:</b> <span th:text="${r.pickedUpAt}"></span></div>
        <div><b>생성일:</b> <span th:text="${r.createdAt}"></span></div>
        <div class="actions"><!-- 수정/삭제 버튼 -->
            <button class="btn"
                    type="button"
                    th:onclick="|location.href='@{/reservations/{id}/edit(id=${r.id})}'|">
                수정
            </button>
            <button
                    class="btn"
                    type="button"
                    th:onclick="|openConfirmModal('@{/reservations/{id}(id=${r.id})}')|">
                삭제
            </button>
        </div>
    </div>
</div>
<!-- 조각 rowFragment(r) 끝 -->


</body>
</html>
