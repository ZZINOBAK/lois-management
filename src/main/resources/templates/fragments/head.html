<html xmlns:th="http://www.thymeleaf.org">

<!-- fragments/head.html -->
<head th:fragment="commonHead(title, extra)">
    <meta charset="UTF-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- auth-jwt.js 용 -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <meta name="is-authenticated"
          th:content="${#authorization.expression('isAuthenticated() and !isAnonymous()')}">

    <title th:text="${title}">Lois Management</title>

    <link rel="stylesheet" th:href="@{/css/common.css}">

    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script th:src="@{/js/auth-jwt.js}" defer></script>
    <script th:src="@{/js/common.js}" defer></script>

    <!-- 페이지별 추가 영역 -->
    <th:block th:replace="${extra}"/>
</head>

</html>
