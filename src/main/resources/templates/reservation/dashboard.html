<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/head :: commonHead('Reservations',
        ~{::pageHead})}">
</head>
<th:block th:remove="all">
<th:block th:fragment="pageHead">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">

    <style>
        .detail-row.hidden {
            display: none;
        }
        .detail-row {
            padding: 10px;
            background: #f9f9f9;
            border-left: 4px solid #ddd;
            margin-bottom: 10px;
        }

        /* 맛 버튼 */
        .flavor-btn {
            min-width: 90px;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid #dde2dd;
            background-color: #f8f8f8;
            font-size: 0.9rem;
            line-height: 1.2;
        }
        .flavor-btn.ready {
            text-decoration: line-through;
            opacity: 0.6;
        }

        /* 결제 뱃지 */
        .badge-paid {
            padding: 4px 10px;
            border-radius: 999px;
            background: #2f7d4a;
            color: #fff;
            font-size: 0.75rem;
        }
        .badge-unpaid {
            padding: 4px 10px;
            border-radius: 999px;
            border: 1px solid #ccc;
            font-size: 0.75rem;
        }

    </style>
    <script>
        function toggleDetailRow(event, id) {
        // 버튼이나 버튼 안쪽을 클릭한 경우는 상세 토글 안함
        if (event.target.closest('button')) {
            return;
        }

        const detail = document.getElementById('detail-' + id);
        if (detail) {
            detail.classList.toggle('hidden');
        }
    }
    </script>
</th:block>
</th:block>


<body>
<div class="wrap">


    <!-- ✨ 공통 헤더 -->
    <header th:replace="~{fragments/header :: site-header}"></header>

    <main>


    <section class="content">
        <div class="list-header">
            <div>
                <h2 class="section-title">케이크 예약 리스트</h2>
                <div class="filters">
                    <!-- 전체: scope=all -->
                    <button class="chip"
                            type="button"
                            hx-get="/reservations/sort?scope=all"
                            hx-target="#list"
                            hx-swap="innerHTML">
                        전체
                    </button>
                    <button class="chip" type="button" onclick="showPreparing()">날짜</button>
                    <!-- 오늘: scope=today -->
                    <button class="chip"
                            type="button"
                            hx-get="/reservations/sort?scope=today"
                            hx-target="#list"
                            hx-swap="innerHTML">
                        오늘
                    </button>
                </div>
            </div>

            <!-- 오른쪽 영역 묶기 -->
            <div class="actions-right">
                <!-- 예약하기 버튼 -->
                <a class="cta" th:href="@{/reservations/new}" role="button">
                    <div class="title">예약하기</div>
                </a>

                <!-- 샘플 버튼 (작게) -->
                <form th:action="@{/reservations/sample}" method="post">
                    <button class="cta-sample" type="submit">샘플</button>
                </form>
            </div>
        </div>

        <!-- 🔹 레전드(왼쪽) + 검색폼(오른쪽) 한 줄 -->
        <div class="reservation-toolbar">
            <div class="reservation-legend">
                <span class="legend-chip legend-sameday"></span>
                <span>오늘 생성된 예약</span>
            </div>

            <form class="reservation-search phone-search-form"
                  method="get"
                  th:action="@{/reservations/search}"
                  th:attr="hx-get=@{/reservations/search}"
                  hx-target="#list"
                  hx-swap="innerHTML">

                <label for="contactSuffix" class="search-label phone-search-label">
                    휴대폰 뒷자리
                </label>

                <div class="phone-search-inline">
                    <input id="contactSuffix"
                           name="contactSuffix"
                           type="text"
                           inputmode="numeric"
                           pattern="[0-9]{4}"
                           maxlength="4"
                           minlength="4"
                           class="phone-input"
                           required>

                    <button type="submit"
                            class="phone-search-btn">
                        검색
                    </button>
                </div>
            </form>
        </div>

        <!-- 📦 픽업예정만 보기 버튼 (이건 그대로 아래에 둠) -->
        <button type="button"
                class="pickup-filter-btn"
                th:attr="hx-get=@{/reservations/filter(pickupStatus='WAITING')}"
                hx-target="#list"
                hx-swap="innerHTML">
            픽업예정만
        </button>


        <div class="thead">
            <div>연번</div>
            <div>날짜</div>
            <div>시간</div>
            <div>맛</div>
            <div>호수</div>
            <div>연락처</div>
            <div>결제</div>
            <div>픽업</div>
<!--            <div style="text-align:right">수정/삭제</div>-->
            <div>수정/삭제</div>
        </div>

        <div id="list" th:fragment="list">
            <!--        <div id="list">-->
            <!--        <div th:each="r : ${reservations}" class="row">-->



            <!--        여기부터-->
            <div th:each="r : ${reservations}"
                 th:insert="~{reservation/dashboard :: rowFragment(r=${r})}">

            <!--                 th:insert="~{reservation/dashboard :: rowFragment(r=${r})}">-->
                <div th:fragment="rowFragment(r)" th:id="'row-block-' + ${r.id}">

                <!-- 요약 행 -->
                    <div class="row summary-row"
                         th:id="'row-' + ${r.id}"
                         th:onclick="|toggleDetailRow(event, ${r.id})|"
                         th:classappend="${r.pickupStatus == 'PICKED'} ? ' picked' : ''"
                         th:attr="data-sameday=${r.createdAt != null
                             and #temporals.format(r.createdAt, 'yyyy-MM-dd') == #temporals.format(today, 'yyyy-MM-dd')}">

                        <!-- 여기까지 행 프레그먼트 추가코드 -->
                        <div th:text="${r.rowNumber}"></div><!-- 연번 -->
                        <div th:text="${#temporals.format(r.resDate, 'yyyy-MM-dd')}"></div>
                        <div th:text="${#temporals.format(r.resTime, 'HH:mm')}"></div>
                        <!--                        <div class="ellipsis" th:text="${r.cakeFlavor}"></div>-->
                        <!-- 🍰 맛 / 제작 상태 버튼 -->
                        <button th:replace="~{reservation/dashboard :: makeButton(r=${r})}"></button>
                        <div th:text="${r.cakeSize}"></div>
<!--                        <div class="ellipsis" th:text="${r.contact}"></div>-->
                        <div class="phone" th:text="${r.contact}"></div>
                        <div>
                            <span th:classappend="${r.paid} ? 'badge-paid' : 'badge-unpaid'">
                                <span th:text="${r.paid} ? '결제완료' : '미결제'"></span>
                            </span>
                        </div>
                        <div class="pickup-cell">
                            <div class="pickup-cell">
                                <!-- 📦 픽업 상태 버튼 -->
                                <button th:replace="~{reservation/dashboard :: pickupButton(r=${r})}"></button>
                            </div>
                        </div>
                        <div class="actions">
                            <button class="btn"
                                    type="button"
                                    th:onclick="|location.href='@{/reservations/{id}/edit(id=${r.id})}'|">
                                수정
                            </button>
                            <button
                                    class="btn"
                                    type="button"
                                    th:onclick="|openConfirmModal('@{/reservations/{id}(id=${r.id})}')|">
                                삭제
                            </button>
                        </div>
                    </div>


                    <!-- 상세 행 -->
                    <div class="detail-row hidden"
                         th:id="'detail-' + ${r.id}">
                        <div><b>요청사항:</b> <span th:text="${r.note}"></span></div>
                        <div><b>초:</b> <span th:text="${r.candles}"></span></div>
                        <div><b>픽업시간:</b> <span th:text="${r.pickedUpAt}"></span></div>
                        <div><b>생성일:</b> <span th:text="${r.createdAt}"></span></div>

                    </div>
                </div>


                <!-- ========================= -->
                <!--  제작 상태 토글 버튼 조각 -->
                <!-- ========================= -->
                <button
                        th:fragment="makeButton(r)"
                        type="button"
                        class="flavor-btn ellipsis"
                        th:text="${r.cakeFlavor}"
                        th:classappend="${r.makeStatus == 'READY'} ? ' ready' : ''"
                        th:attr="hx-patch=@{/api/reservations/{id}/make-toggle(id=${r.id})}"
                        hx-swap="outerHTML">
                </button>

                <!-- ========================= -->
                <!--  픽업 상태 토글 버튼 조각 -->
                <!-- ========================= -->
                <button
                        th:fragment="pickupButton(r)"
                        class="btn pickup-btn"
                        th:classappend="${r.pickupStatus == 'PICKED'} ? ' picked-btn' : ''"
                        th:attr="hx-patch=@{/api/reservations/{id}/pickup-toggle(id=${r.id})}"
                        hx-swap="outerHTML">
                    <span th:text="${r.pickupStatus == 'PICKED' ? '픽업완료' : '픽업예정'}"></span>

                </button>
            </div>
            <!-- ✅ 오늘(scope == 'today')일 때만 인쇄 버튼 보이기 -->
            <div th:if="${scope == 'today'}"
                 class="list-print-actions"
                 style="display:flex; justify-content:flex-end; margin: 8px 0;">
                <button type="button"
                        class="chip"
                        onclick="window.open('/reservations/print', '_blank')">
                    오늘 케이크 리스트 인쇄
                </button>
            </div>
        </div>
    </section>


    <!-- 삭제 확인 모달 -->
    <div id="confirm-modal" class="confirm-modal hidden">

        <div class="confirm-modal__content">
            <p class="confirm-modal__text">정말 이 예약을 삭제하시겠어요?</p>

            <div class="confirm-modal__actions">
                <button id="confirm-yes"
                        class="confirm-modal__btn confirm-modal__btn--yes">
                    예
                </button>
                <button id="confirm-no"
                        class="confirm-modal__btn confirm-modal__btn--no">
                    아니오
                </button>
            </div>
        </div>
    </div>
    </main>

    <!-- ✨ 공통 푸터 -->
    <footer th:replace="~{fragments/footer :: site-footer}"></footer>

</div>

<script>
    let pendingDeleteUrl = null;

    function openConfirmModal(url) {

        pendingDeleteUrl = url;
        document.getElementById("confirm-modal").classList.remove("hidden");
    }

    function closeConfirmModal() {
        pendingDeleteUrl = null;
        document.getElementById("confirm-modal").classList.add("hidden");
    }

    document.getElementById("confirm-yes").addEventListener("click", function() {
        if (pendingDeleteUrl) {
            htmx.ajax('DELETE', pendingDeleteUrl, {
                target: '#list',
                swap: 'innerHTML'
            });
        }
        closeConfirmModal();
    });

    document.getElementById("confirm-no").addEventListener("click", closeConfirmModal);
</script>
<script>
    // 픽업 버튼 눌렀을 때 행에 picked 클래스 토글
    document.addEventListener('click', function (e) {
      const btn = e.target.closest('.pickup-btn');
      if (!btn) return;

      const row = btn.closest('.summary-row');
      if (!row) return;

      row.classList.toggle('picked');
    });
</script>
</body>
</html>
