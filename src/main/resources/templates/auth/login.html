<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/head :: head('login', ~{::pageResources})}">
    <!-- 페이지 별 리소스 추가 -->
    <th:block th:fragment="pageResources">
        <link rel="stylesheet" th:href="@{/css/index.css}">
        <link rel="stylesheet" th:href="@{/css/auth/login.css}">
    </th:block>
</head>
<body>
    <div class="wrap">
        <!-- 공통 헤더 -->
        <header th:replace="~{fragments/header :: header}"></header>

        <!-- 이 페이지 내용 -->
        <main>
            <form method="post" action="/login">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div>
                    <label for="username">아이디</label>
                    <input type="text" id="username" name="username" value="admin" autocomplete="username" required />
                </div>

                <div>
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required />
                </div>

                <button type="submit">로그인</button>

                <div th:if="${error}">
                    아이디 또는 비밀번호가 올바르지 않습니다.
                </div>

                <div th:if="${logout}">
                    로그아웃 되었습니다.
                </div>
            </form>

            <!-- 소셜 로그인 영역 -->
            <div class="social-box">
                <div class="social-title">또는 소셜 계정으로 로그인</div>
                <div class="social-buttons">
                    <!-- 구글 로그인 -->
                    <a class="btn-social btn-google" href="/oauth2/authorization/google">
                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
                        <span>Google로 로그인</span>
                    </a>

                    <!-- 카카오 로그인 -->
                    <a class="btn-social btn-kakao" href="/oauth2/authorization/kakao">
                        <!-- 공식 버튼 이미지 써도 되고, 텍스트만 해도 됨 -->
                        <span>카카오 계정으로 로그인</span>
                    </a>
                </div>
            </div>
        </main>

        <!-- 공통 푸터 -->
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </div>
</body>
</html>
