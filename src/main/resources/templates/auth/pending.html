<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>승인 대기 | LOIS</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 360px;
            width: 85%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        h2 { margin-bottom: 16px; }
        p { color: #666; line-height: 1.7; }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>관리자 승인 대기 중</h2>
    <p>
        회원가입이 완료되었습니다.<br>
        관리자의 승인이 필요한 계정입니다.<br>
        승인 후 서비스를 이용할 수 있습니다.
    </p>
    <form action="/logout" method="post">
        <input type="hidden"
               name="_csrf"
               th:value="${_csrf.token}">

        <button type="submit">로그아웃</button>
    </form>
</div>
</body>
</html>
