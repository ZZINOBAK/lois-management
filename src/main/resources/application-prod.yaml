spring:
  config:
    activate:
      on-profile: prod
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  thymeleaf:
    cache: true


logging:
  level:
    root: INFO
    com.lois: INFO

lois:
  ip-whitelist:
    enabled: true
    allowed: ${ALLOWED_IPS}
    public-paths:
      - /
      - /reservations
      - /api/reservations
      - /css
      - /js
      - /images
      - /access-request
      - /actuator/health

management:
  endpoints:
    web:
      exposure:
        include: health       # health 엔드포인트 웹으로 노출
  endpoint:
    health:
      show-details: never     # 상태만 UP/DOWN 보이게

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000
  prefix: Bearer

server:
  servlet:
    session:
      timeout: 60m

solapi:
  api:
    key: ${SOLAPI_API_KEY}
    secret: ${SOLAPI_API_SECRET}
    sender-number: ${SOLAPI_SENDER_NUMBER}
    recipient-number: ${SOLAPI_RECIPIENT_NUMBER}