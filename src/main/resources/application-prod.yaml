spring:
  config:
    activate:
      on-profile: prod
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  thymeleaf:
    cache: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-authentication-method: none
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
            client-name: Kakao

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id


logging:
  level:
    root: INFO
    com.lois: INFO

lois:
  ip-whitelist:
    enabled: false
    allowed: ${ALLOWED_IPS}
    public-paths:
      - /
      - /reservations
      - /api/reservations
      - /css
      - /js
      - /images
      - /access-request
      - /demo
      - /actuator/health

management:
  endpoints:
    web:
      exposure:
        include: health       # health 엔드포인트 웹으로 노출
  endpoint:
    health:
      show-details: never     # 상태만 UP/DOWN 보이게

jwt:
  secret: ${JWT_SECRET}
  expiration: 10800000
  prefix: Bearer

server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 8h

solapi:
  api:
    key: ${SOLAPI_API_KEY}
    secret: ${SOLAPI_API_SECRET}
    sender-number: ${SOLAPI_SENDER_NUMBER}
    recipient-number: ${SOLAPI_RECIPIENT_NUMBER}
