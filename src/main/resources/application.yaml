spring:
  security:
    debug: false

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.lois.management.domain
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET}
  prefix: Bearer
  expiration: 900000

logging:
  level:
    root: INFO