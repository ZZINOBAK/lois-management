spring:
  profiles:
    active: local
  security:
    debug: true
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.lois.management.domain
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET}
  prefix: Bearer
  expiration: 0

logging:
  level:
    org.springframework.security.web.FilterChainProxy: DEBUG