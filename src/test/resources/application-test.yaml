spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lois?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
    username: root
    password: ${LOCAL_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

solapi:
  api:
    key: test
    secret: test
    sender-number: 01000000000
    recipient-number: 01000000000

reservation:
  limiter:
    type: local-lock

# 테스트 실행 시 실제(로컬) DB 재고가 0으로 바뀌지 않도록 일일 재고 초기화를 끈다.
lois:
  stock-reset:
    enabled: false
